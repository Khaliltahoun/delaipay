<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DelaiPay</title>
<meta name="theme-color" content="#0E3544">
<link rel="icon" href="/favicon.ico" sizes="16x16 32x32">
<link rel="icon" type="image/png" sizes="16x16" href="/assets/brand/favicon-16.png">
<link rel="icon" type="image/png" sizes="32x32" href="/assets/brand/favicon-32.png">
<link rel="apple-touch-icon" href="/assets/brand/apple-touch-icon.png">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="preload" href="/assets/fonts/inter-latin-var.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/css/app.css">
</head>
<body>
<a class="skip" href="#view">Aller au contenu</a>
<div class="app" id="app">
  <aside class="side" id="side" aria-label="Navigation principale">
    <a class="ws-card" id="wsCard" href="#dash" data-view="dash" title="Espace de travail — vue d'ensemble">
      <div class="ws-mono" id="wsMono">··</div>
      <div class="ws-meta"><b id="wsName">Espace de travail</b><small id="wsSub">Espace de travail</small></div>
    </a>

    <div class="nav-lbl">Cabinet</div>
    <button class="nav-item" data-view="dash">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/></svg>Vue d'ensemble</button>
    <button class="nav-item" data-view="clients">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M3 21h18M5 21V7l7-4 7 4v14M9 9h.01M15 9h.01M9 13h.01M15 13h.01M10 21v-4h4v4"/></svg>Clients</button>
    <button class="nav-item" data-view="retards">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M6 2h9l5 5v13a2 2 0 01-2 2H6a2 2 0 01-2-2V4a2 2 0 012-2z"/><path d="M14 2v6h6M12 12v3l2 1.5"/></svg>Factures en retard</button>
    <button class="nav-item" data-view="alerts">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M6 9a6 6 0 1112 0c0 5 2 6 2 6H4s2-1 2-6z"/><path d="M10 20a2 2 0 004 0"/></svg>Alertes<span class="badge hidden" id="alertBadge">0</span></button>

    <div class="nav-lbl">Dossier <span class="scope" id="navScope">—</span></div>
    <button class="nav-item" data-view="client">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="12" cy="12" r="9"/><path d="M12 3v9l6.4 6.4"/></svg>Synthèse du dossier</button>
    <button class="nav-item" data-view="delais">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M4 9h16M4 15h16M10 9v12"/></svg>Délais de paiement</button>
    <button class="nav-item" data-view="conv">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M6 2h9l5 5v13a2 2 0 01-2 2H6a2 2 0 01-2-2V4a2 2 0 012-2z"/><path d="M14 2v6h6M9 14l2 2 4-4"/></svg>Conventions</button>
    <button class="nav-item" data-view="decl">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M6 2h9l5 5v13a2 2 0 01-2 2H6a2 2 0 01-2-2V4a2 2 0 012-2z"/><path d="M14 2v6h6M8 13h8M8 17h5"/></svg>Déclaration DGI</button>
    <button class="nav-item" data-view="visa">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M9 12l2 2 4-4"/><circle cx="12" cy="12" r="9"/></svg>Visa</button>
    <button class="nav-item" data-view="import">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M12 3v12m0 0l-4-4m4 4l4-4M4 19h16"/></svg>Imports</button>
    <button class="nav-item" data-view="exports">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M12 15V3m0 0L8 7m4-4l4 4M4 15v4a2 2 0 002 2h12a2 2 0 002-2v-4"/></svg>Exports</button>

    <div class="nav-lbl">Contrôle</div>
    <button class="nav-item" data-view="anomalies">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M12 9v4m0 4h.01M10.3 3.9L2 18a2 2 0 001.7 3h16.6a2 2 0 001.7-3L13.7 3.9a2 2 0 00-3.4 0z"/></svg>Anomalies</button>
    <button class="nav-item" data-view="audit">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M4 5h16M4 12h16M4 19h10"/></svg>Journal d'audit</button>
    <button class="nav-item" data-view="settings">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 00.3 1.8l.1.1a2 2 0 11-2.8 2.8l-.1-.1a1.7 1.7 0 00-1.8-.3 1.7 1.7 0 00-1 1.5V21a2 2 0 11-4 0v-.1a1.7 1.7 0 00-1.1-1.5 1.7 1.7 0 00-1.8.3l-.1.1a2 2 0 11-2.8-2.8l.1-.1a1.7 1.7 0 00.3-1.8 1.7 1.7 0 00-1.5-1H3a2 2 0 110-4h.1a1.7 1.7 0 001.5-1.1 1.7 1.7 0 00-.3-1.8l-.1-.1a2 2 0 112.8-2.8l.1.1a1.7 1.7 0 001.8.3H9a1.7 1.7 0 001-1.5V3a2 2 0 114 0v.1a1.7 1.7 0 001 1.5 1.7 1.7 0 001.8-.3l.1-.1a2 2 0 112.8 2.8l-.1.1a1.7 1.7 0 00-.3 1.8V9a1.7 1.7 0 001.5 1H21a2 2 0 110 4h-.1a1.7 1.7 0 00-1.5 1z"/></svg>Paramètres</button>

    <div class="side-foot">
      <div class="av" id="sideAv">··</div>
      <div style="min-width:0"><b style="display:block;font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis" id="sideName">—</b><span id="sideTitle">—</span></div>
    </div>
    <div class="powered-by"><img src="/assets/brand/delaipay-symbol-dark-bg.svg" alt="" width="14" height="14">Propulsé par <b>DelaiPay</b></div>
  </aside>

  <div class="main">
    <header class="topbar">
      <button class="iconbtn menu-btn" id="menuBtn" aria-label="Ouvrir la navigation" aria-expanded="false" aria-controls="side">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button>
      <nav class="crumb" aria-label="Fil d'Ariane"><b id="cabName">Espace</b>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 6l6 6-6 6"/></svg>
        <span id="crumbView">Vue d'ensemble</span></nav>
      <div class="tb-spacer"></div>

      <div class="clientsw-wrap">
        <button class="clientsw" id="clientSwBtn" aria-haspopup="listbox" aria-expanded="false" title="Dossier client actif">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 21h18M5 21V7l7-4 7 4v14M10 21v-4h4v4"/></svg>
          <span class="csw-kind">Dossier</span>
          <span class="csw-name" id="cswName">Tous les clients</span>
          <svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 9l6 6 6-6"/></svg>
        </button>
        <div class="csw-panel hidden" id="cswPanel">
          <div class="csw-head">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4-4"/></svg>
            <input id="cswSearch" placeholder="Rechercher un client, un ICE…" autocomplete="off" aria-label="Rechercher un client">
          </div>
          <div class="csw-list" id="cswList" role="listbox"></div>
        </div>
      </div>

      <!-- Sélecteur global de PÉRIODE (année + trimestre) — concept de premier plan -->
      <div class="period-wrap" id="periodWrap">
        <button class="periodsw" id="periodBtn" aria-haspopup="true" aria-expanded="false" title="Période de travail">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="4" width="18" height="17" rx="2"/><path d="M3 9h18M8 2v4M16 2v4"/></svg>
          <span class="period-name" id="periodLabel">Période</span>
          <span class="period-badge" id="periodBadge"></span>
          <svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 9l6 6 6-6"/></svg>
        </button>
        <div class="period-panel hidden" id="periodPanel" role="dialog" aria-label="Période de travail">
          <div class="pp-row">
            <button class="pp-nav" id="perPrev" title="Trimestre précédent" aria-label="Trimestre précédent"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 6l-6 6 6 6"/></svg></button>
            <div class="pp-cur" id="perCur">T— ————</div>
            <button class="pp-nav" id="perNext" title="Trimestre suivant" aria-label="Trimestre suivant"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 6l6 6-6 6"/></svg></button>
          </div>
          <div class="pp-quick">
            <button class="pp-q" id="perWork">Trimestre en cours de traitement</button>
            <button class="pp-q" id="perData">Période la plus fournie</button>
          </div>
          <div class="pp-actions" id="perActions"></div>
          <div class="pp-sub">Périodes disponibles pour ce client</div>
          <div class="pp-list" id="perList"></div>
        </div>
      </div>

      <div class="search">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4-4"/></svg>
        <input placeholder="Rechercher un client, un ICE…" id="globalSearch" aria-label="Recherche globale" autocomplete="off"/>
        <div class="searchres hidden" id="searchRes"></div>
      </div>
      <div class="top-right">
        <button class="iconbtn" data-view="alerts" aria-label="Alertes" title="Alertes"><span class="ndot hidden" id="notifDot"></span>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M6 9a6 6 0 1112 0c0 5 2 6 2 6H4s2-1 2-6z"/><path d="M10 20a2 2 0 004 0"/></svg></button>
        <div class="umenu-wrap">
          <button class="avatar" id="topAv" aria-haspopup="menu" aria-expanded="false" aria-controls="userMenu" title="Mon compte">··</button>
          <div class="menu hidden" id="userMenu" role="menu">
            <div class="menu-h"><b id="umName">—</b><small id="umMail">—</small>
              <div class="ws-line"><span class="ws-mono" id="umMono" style="width:18px;height:18px;font-size:9px;border-radius:5px">··</span><span id="umWs">—</span></div></div>
            <button class="menu-item" role="menuitem" data-view="settings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M2 12h3M19 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1"/></svg>Paramètres de l'espace</button>
            <button class="menu-item" role="menuitem" id="themeBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M21 12.8A9 9 0 1111.2 3 7 7 0 0021 12.8z"/></svg><span id="themeLbl">Thème sombre</span></button>
            <div class="menu-sep"></div>
            <button class="menu-item danger" role="menuitem" id="logoutBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M15 12H3m0 0l4-4m-4 4l4 4M11 4h6a2 2 0 012 2v12a2 2 0 01-2 2h-6"/></svg>Se déconnecter</button>
          </div>
        </div>
      </div>
    </header>
    <div class="ctx-banner hidden" id="ctxBanner" role="status"></div>
    <main class="content" id="view" tabindex="-1"></main>
  </div>
</div>
<div id="overlay"></div>
<div class="toasts" id="toasts" role="status" aria-live="polite"></div>
<script src="/js/app.js"></script>
</body>
</html>
