# /etc/ssh/sshd_config.d/50-delaipay-staging.conf — compte de déploiement DelaiPay staging : clé SSH seulement, aucun tunnel.
# (Debian/Ubuntu : le fichier principal contient « Include /etc/ssh/sshd_config.d/*.conf » ; la première valeur lue l'emporte.)
Match User delaipay-staging
    PubkeyAuthentication yes
    PasswordAuthentication no
    KbdInteractiveAuthentication no
    AuthenticationMethods publickey
    AllowTcpForwarding no
    AllowStreamLocalForwarding no
    AllowAgentForwarding no
    X11Forwarding no
    PermitTunnel no
    PermitUserRC no
    PermitTTY yes
    AuthorizedKeysFile /srv/delaipay-staging/.ssh/authorized_keys
