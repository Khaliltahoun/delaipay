# /etc/nginx/sites-available/delaipay.conf — DelaiPay PRODUCTION (*.delaipay.com). Le staging (*.staging.delaipay.com)
# garde son propre fichier : nginx choisit toujours le joker le plus long, *.staging.delaipay.com y reste servi.
# N'altère PAS la configuration de la production (delaipay.hlzconsulting.ma) : fichier séparé, server_name distincts,
# amont distinct (127.0.0.1:4300). Activer : ln -s ../sites-available/delaipay.conf /etc/nginx/sites-enabled/
# Tester : nginx -t && systemctl reload nginx

upstream delaipay_prod {
    server 127.0.0.1:4300;          # port LOCAL de l'application (jamais ouvert dans le pare-feu)
    keepalive 16;
}

# Limitation de débit en frontal (en plus de celle de l'application) — connexion et console.
limit_req_zone $binary_remote_addr zone=dp_prd_login:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=dp_prd_api:10m rate=20r/s;

# ---- HTTP → HTTPS (et défi ACME HTTP-01 éventuel pour d'autres certificats ; le joker utilise DNS-01)
server {
    listen 80;
    listen [::]:80;
    server_name admin.delaipay.com *.delaipay.com;
    location /.well-known/acme-challenge/ { root /var/www/letsencrypt; }
    location / { return 301 https://$host$request_uri; }
}

# ---- HTTPS : console et espaces (même application ; la répartition console / espace est faite par l'hôte)
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name admin.delaipay.com *.delaipay.com;

    # Certificat JOKER *.delaipay.com (Let's Encrypt, défi DNS-01) — docs/STAGING.md §4
    ssl_certificate     /etc/letsencrypt/live/delaipay.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/delaipay.com/privkey.pem;
    include snippets/delaipay-tls.conf;

    include snippets/delaipay-headers.conf;

    # Taille des requêtes : imports de classeurs et justificatifs (25 Mo côté application) ; logos 1 Mo.
    client_max_body_size 26m;
    client_body_timeout 60s;
    proxy_read_timeout 120s;          # imports lourds analysés côté serveur

    access_log /var/log/nginx/delaipay.access.log;
    error_log  /var/log/nginx/delaipay.error.log warn;

    # Santé : sans authentification basique, pour la surveillance externe (réponse sans secret ni donnée).
    location = /healthz { auth_basic off; proxy_pass http://delaipay_prod; include snippets/delaipay-proxy.conf; }

    location = /api/auth/login { limit_req zone=dp_prd_login burst=10 nodelay; proxy_pass http://delaipay_prod; include snippets/delaipay-proxy.conf; }
    location /api/platform/auth/ { limit_req zone=dp_prd_login burst=10 nodelay; proxy_pass http://delaipay_prod; include snippets/delaipay-proxy.conf; }
    location /api/ { limit_req zone=dp_prd_api burst=60 nodelay; proxy_pass http://delaipay_prod; include snippets/delaipay-proxy.conf; }
    location / { proxy_pass http://delaipay_prod; include snippets/delaipay-proxy.conf; }
}
