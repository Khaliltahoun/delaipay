# /etc/nginx/snippets/delaipay-headers.conf — en-têtes de sécurité complémentaires (l'application pose déjà sa CSP,
# X-Frame-Options, nosniff, Referrer-Policy… ; nginx ajoute HSTS, qui n'a de sens qu'en HTTPS).
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Robots-Tag "noindex, nofollow" always;   # staging : jamais indexé
server_tokens off;
