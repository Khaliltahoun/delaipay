# /etc/nginx/snippets/delaipay-staging-basic-auth.conf — mot de passe nginx DEVANT tout le staging (en plus de la
# connexion de l'application) : le staging n'est pas découvrable publiquement. /healthz reste ouvert (surveillance).
# Créer le fichier : sudo htpasswd -c -B /etc/nginx/delaipay-staging.htpasswd fondateur
# Activer : décommenter l'include dans delaipay-staging.conf, puis nginx -t && systemctl reload nginx. Désactiver : recommenter.
auth_basic "DelaiPay staging";
auth_basic_user_file /etc/nginx/delaipay-staging.htpasswd;
