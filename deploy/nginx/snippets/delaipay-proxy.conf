# /etc/nginx/snippets/delaipay-proxy.conf — en-têtes transmis à l'application (TRUST_PROXY=loopback les croit).
proxy_http_version 1.1;
proxy_set_header Connection "";
proxy_set_header Host $host;
proxy_set_header X-Forwarded-For $remote_addr;      # remplace (n'ajoute pas) : aucun X-Forwarded-For du client n'est transmis
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Forwarded-Host $host;
proxy_set_header X-Request-Id $request_id;           # corrélation nginx ↔ journal de l'application
proxy_hide_header X-Powered-By;
